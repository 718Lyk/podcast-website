name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # 失败时把 svelte-check 报错转成 annotation（API 可读）便于定位
      - run: |
          npm run check > check-output.log 2>&1 || {
            awk -v RS='' '/Error:|Warn:/' check-output.log | head -20 | while IFS= read -r para; do
              echo "::error::$(printf '%s' "$para" | tr '\n' ' ' | cut -c1-600)"
            done
            exit 1
          }
      - run: npm run build
